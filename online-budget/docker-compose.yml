name: online-budget

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: budget
      POSTGRES_USER: budget
      POSTGRES_PASSWORD: budget_dev
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./compose/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports: ["5432:5432"]

  web:
    build: { context: ., dockerfile: Dockerfile }
    command: uv run python budget/manage.py runserver 0.0.0.0:8000
    volumes: ["./:/app"]
    env_file: .env
    depends_on: [db]
    ports: ["8000:8000"]

  qcluster:
    build: { context: ., dockerfile: Dockerfile }
    command: uv run python budget/manage.py qcluster
    env_file: .env
    depends_on: [db, web]

volumes:
  pgdata: