[project]
name = "console-ai-chat"
version = "0.1.0"
description = "Simple console AI chat using LangChain"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.3.14",
    "langchain-openrouter>=0.2.7",
    "python-dotenv>=1.2.2",
]

[project.scripts]
console-ai-chat = "console_ai_chat.modules.chat.delivery.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/console_ai_chat"]
